name: Curriculum

on:
  push:
  workflow_dispatch:
    inputs:
      LEVEL:
        description: 'Optional curriculum difficulty level'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build browser engine bundle
        run: npm run build:engine
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run curriculum tests
        run: npm run test:curriculum
        env:
          LEVEL: ${{ inputs.LEVEL || '' }}
          SEED: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagrams
          path: test-output/*.png
          if-no-files-found: ignore
