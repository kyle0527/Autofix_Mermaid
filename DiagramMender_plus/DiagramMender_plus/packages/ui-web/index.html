<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DiagramMender UI (ESM)</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="dns-prefetch" href="https://unpkg.com" />
  </head>
  <body>
    <header>
      <h1>DiagramMender — UI (ES Modules)</h1>
      <div class="actions">
        <button id="btn-render" title="⏎+Enter 亦可渲染">修正並渲染</button>
        <label class="theme">
          <input type="checkbox" id="chk-dark" />
          <span>Dark</span>
        </label>
      </div>
    </header>

    <main>
      <section class="left">
        <textarea id="src" spellcheck="false" placeholder="在此貼上或編輯 Mermaid 內容…"></textarea>
        <div class="hints">
          <p>支援 <code>flowchart</code> / <code>sequenceDiagram</code> / <code>gantt</code> 等。按「修正並渲染」會套用 AutoFix 規則以相容新版 Mermaid。</p>
        </div>
      </section>
      <section class="right">
        <div id="out" class="out"></div>
        <pre id="log" class="log" aria-live="polite"></pre>
      </section>
    </main>

    <footer>
      <small>ES6 modules • Mermaid from CDN • 無打包工具（暫時）</small>
    </footer>

    <!-- ！！！重點：使用 ES6 模組 ！！！ -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
